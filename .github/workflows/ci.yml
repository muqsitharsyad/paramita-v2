name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: paramita_final
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, fileinfo, mbstring, openssl, pdo_mysql
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node dependencies and build frontend
        run: |
          npm ci
          npm run build

      - name: Prepare application
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3307
          DB_DATABASE: paramita_final
          DB_USERNAME: root
          DB_PASSWORD: ""
          PARAMITA_INTEGRATION_KEY: "base64:dGVzdGtleXRlc3RrZXl0ZXN0a2V5dGVzdGtleTEyMzQ="
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --seed --force

      - name: Validate PHP style and tests
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3307
          DB_DATABASE: paramita_final
          DB_USERNAME: root
          DB_PASSWORD: ""
          PARAMITA_INTEGRATION_KEY: "base64:dGVzdGtleXRlc3RrZXl0ZXN0a2V5dGVzdGtleTEyMzQ="
        run: |
          composer validate --strict --no-check-publish
          php vendor/bin/pint --test
          php artisan test --no-coverage

      - name: Build frontend
        if: false  # already built above; kept as placeholder
        run: |
          npm ci
          npm run build
